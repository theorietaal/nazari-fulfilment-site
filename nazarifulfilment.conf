# Nazari Fulfilment Center - statische site. Los van fulfilkit/hethandel.nl.
server {
    listen 80;
    listen [::]:80;
    server_name nazarifulfilment.nl www.nazarifulfilment.nl;
    root /var/www/nazarifulfilment;
    index index.html;
    if ($host = www.nazarifulfilment.nl) {
        return 301 https://nazarifulfilment.nl$request_uri;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
